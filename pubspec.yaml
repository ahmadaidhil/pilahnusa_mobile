name: pilahnusa_mobile
description: "PilahNusa AI Mobile - Aplikasi Pemilahan Sampah Berbasis AI dan Edukasi Lingkungan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.1.2
  tflite_flutter: 0.12.1
  image: ^4.5.4
  http: ^1.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
